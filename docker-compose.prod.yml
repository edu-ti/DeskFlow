version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskflow_db
    environment:
      POSTGRES_USER: ${DB_USER:-deskflow}
      POSTGRES_PASSWORD: ${DB_PASS:-deskflow_secure_password_2026}
      POSTGRES_DB: ${DB_NAME:-deskflow_db}
    volumes:
      - deskflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-deskflow} -d ${DB_NAME:-deskflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: deskflow_redis
    volumes:
      - deskflow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deskflow_backend
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-deskflow}
      DB_PASS: ${DB_PASS:-deskflow_secure_password_2026}
      DB_NAME: ${DB_NAME:-deskflow_db}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-deskflow_super_secret_jwt_token_production_2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-DeskFlow Support <suporte@deskflow.local>}
    volumes:
      - deskflow_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: deskflow_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: always

volumes:
  deskflow_pgdata:
  deskflow_redisdata:
  deskflow_uploads:
