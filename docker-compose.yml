version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: deskflow_db
    environment:
      POSTGRES_USER: deskflow
      POSTGRES_PASSWORD: deskflow_password
      POSTGRES_DB: deskflow_db
    ports:
      - "5434:5432"
    volumes:
      - deskflow_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: deskflow_redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: deskflow_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - deskflow_esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

volumes:
  deskflow_pgdata:
  deskflow_esdata:

